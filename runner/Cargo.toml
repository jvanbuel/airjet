[package]
name = "airjet-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wasmtime = "50.0.2"
wasmtime-wasi = "50.0.2"

[profile.release]
lto = "thin"
strip = true
