apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: airjet}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: airflow}
            - {name: POSTGRES_PASSWORD, value: airflow}
            - {name: POSTGRES_DB, value: airflow}
          args: ["-c", "max_connections=300"]
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: ["pg_isready", "-U", "airflow"]}, periodSeconds: 2}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: airjet}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
