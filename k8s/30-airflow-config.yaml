apiVersion: v1
kind: ServiceAccount
metadata: {name: airflow, namespace: airjet}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: airflow-pods, namespace: airjet}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, pods/exec, events]
    verbs: [create, get, list, watch, delete, patch, deletecollection]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: airflow-pods, namespace: airjet}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: airflow-pods}
subjects: [{kind: ServiceAccount, name: airflow, namespace: airjet}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: airflow-env, namespace: airjet}
data:
  # Airflow 3 multi-executor: tasks pick one via `executor=`; the first is the default.
  AIRFLOW__CORE__EXECUTOR: "LocalExecutor,KubernetesExecutor,WasmExecutor:airjet_airflow.executor.WasmExecutor"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
  AIRFLOW__CORE__PARALLELISM: "32"
  AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "32"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
  AIRFLOW__CORE__FERNET_KEY: "UKMzEm3yIuFYEq1y3-2FxPNWSVwRASpahmQ9kQfEr8E="
  AIRFLOW__API_AUTH__JWT_SECRET: "airjet-poc-not-a-secret"
  AIRFLOW__API__SECRET_KEY: "airjet-poc-not-a-secret"
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
  AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
  AIRFLOW__KUBERNETES_EXECUTOR__NAMESPACE: "airjet"
  AIRFLOW__KUBERNETES_EXECUTOR__POD_TEMPLATE_FILE: "/opt/airflow/pod-template/pod_template.yaml"
  AIRFLOW__KUBERNETES_EXECUTOR__DELETE_WORKER_PODS: "True"
  # Default is 1 pod per scheduler loop; raise it so the baseline isn't artificially throttled.
  AIRFLOW__KUBERNETES_EXECUTOR__WORKER_PODS_CREATION_BATCH_SIZE: "32"
  AIRJET_NAMESPACE: "airjet"
  AIRJET_RUNNER_URL: "http://airjet-runner:8080"
  AIRJET_PIPELINE_IMAGE: "airjet/pipeline-native:dev"
  AIRJET_BENCH_FAN_OUT: "8"
---
apiVersion: v1
kind: ConfigMap
metadata: {name: airflow-pod-template, namespace: airjet}
data:
  pod_template.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: placeholder
    spec:
      serviceAccountName: airflow
      restartPolicy: Never
      containers:
        - name: base
          image: airjet/airflow:dev
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: airflow-env}}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
